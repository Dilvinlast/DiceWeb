<!DOCTYPE html>
<html lang="lv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Millionaire Mind Dice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Metamais kauliņš</h1>

        <div class="selector-container">

            <label for="diceSelector">
                Kauliņa veids
            </label>

            <select id="diceSelector">
                <option value="d6">D6</option>
                <option value="d4">D4</option>
                <option value="d8">D8</option>
                <option value="d10">D10</option>
                <option value="d12">D12</option>
                <option value="d20">D20</option>
            </select>

        </div>


        <div id="diceContainer"></div>


        <p class="result-label">
            Kauliņa rezultāts
        </p>

        <div id="result">-</div>


        <button id="rollButton">
            Mest kauliņu
        </button>

    </main>


<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/fflate@0.6.9/umd/index.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

<script src="dice.js"></script>
<script src="script.js"></script>
</body>

</html>
